<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 5 Demo</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-4">Bootstrap 5 Demo</h1>

    <div class="row g-4">

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 h-100">
                <div class="card-body">
                    <h5 class="card-title">Grid Sistemi</h5>
                    <p class="card-text">
                        Bootstrap Grid sistemi responsive sayfa düzenleri
                        oluşturmak için kullanılır.
                    </p>
                    <button class="btn btn-primary">Detay</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 h-100">
                <div class="card-body">
                    <h5 class="card-title">Spacing</h5>
                    <p class="card-text">
                        Margin ve padding yardımcı sınıfları ile
                        elementlerin boşlukları düzenlenebilir.
                    </p>
                    <button class="btn btn-success">İncele</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-3 h-100">
                <div class="card-body">
                    <h5 class="card-title">Components</h5>
                    <p class="card-text">
                        Card ve button gibi hazır Bootstrap bileşenleri
                        arayüz geliştirmeyi kolaylaştırır.
                    </p>
                    <button class="btn btn-warning">Göster</button>
                </div>
            </div>
        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
